name: RMS Monitor Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check monitoring environment
        run: |
          echo "RMS monitoring environment test"
          echo "GitHub Actions is running normally."
          echo "Existing RMS data will not be modified."

      - name: Test official source connections
        run: python3 rms_source_check.py
      - name: Test environment ministry monitoring
        run: python3 rms_env_monitor.py
      - name: Test environment ministry monitoring v0.2
        run: python3 rms_env_monitor_v02.py
      - name: Test environment ministry monitoring v0.3
        run: python3 rms_env_monitor_v03.py
      - name: Test environment ministry monitoring v0.4
        run: python3 rms_env_monitor_v04.py
      - name: Test environment ministry monitoring v0.5
        run: python3 rms_env_monitor_v05.py
      - name: Save v0.5 test snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rms-env-monitor-v05-snapshot
          path: rms-env-monitor-v05-test.json
          if-no-files-found: error
          retention-days: 30

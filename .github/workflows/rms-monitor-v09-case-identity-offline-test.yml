name: RMS Monitor v0.9 Case Identity Offline Safety Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  case-identity-offline-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out test files
        uses: actions/checkout@v4

      - name: Run case identity offline safety tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest -v test_rms_v09_case_identity_prototype.py

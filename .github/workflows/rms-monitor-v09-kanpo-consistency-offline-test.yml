name: RMS Monitor v0.9 Kanpo Consistency Offline Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kanpo-consistency-offline-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out test files
        uses: actions/checkout@v4

      - name: Run Kanpo consistency diagnostic tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest -v test_rms_v09_kanpo_consistency_diagnostic.py

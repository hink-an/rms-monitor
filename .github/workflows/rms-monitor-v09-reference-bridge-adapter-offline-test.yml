name: RMS Monitor v0.9 Reference Bridge Adapter Offline Safety Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-bridge-adapter-offline-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out test files
        uses: actions/checkout@v4

      - name: Run reference bridge adapter offline safety tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest -v test_rms_v09_reference_bridge_adapter_prototype.py

name: RMS Monitor v0.9 Official Reference v04 Offline Safety Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-reference-v04-offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out test files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Python syntax
        run: |
          python3 -m py_compile rms_v09_official_reference_prototype_v04.py
          python3 -m py_compile test_rms_v09_official_reference_prototype_v04.py

      - name: Run v04 offline safety tests
        run: |
          python3 -B -m unittest -v test_rms_v09_official_reference_prototype_v04.py

      - name: Run v03 regression tests
        run: |
          python3 -B -m unittest -v test_rms_v09_official_reference_prototype_v03.py

      - name: Run v02 regression tests
        run: |
          python3 -B -m unittest -v test_rms_v09_official_reference_prototype_v02.py

      - name: Run existing Kanpo regression tests
        run: |
          python3 -B -m unittest -v test_rms_v09_kanpo_consistency_diagnostic.py

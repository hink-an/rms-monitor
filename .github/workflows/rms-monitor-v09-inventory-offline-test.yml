name: RMS Monitor v0.9 Inventory Offline Safety Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-offline-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out test files
        uses: actions/checkout@v4

      - name: Run synthetic offline-only safety tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest -v test_rms_v09_offline_inventory_classifier.py

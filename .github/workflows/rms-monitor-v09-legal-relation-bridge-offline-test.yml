name: RMS Monitor v0.9 Legal Relation Bridge Offline Safety Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal-relation-bridge-offline-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out test files
        uses: actions/checkout@v4

      - name: Run legal relation bridge offline safety tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest -v test_rms_v09_legal_relation_bridge_prototype.py

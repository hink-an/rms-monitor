name: RMS Monitor v0.9 e-Gov API Live Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  egov-api-live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out test files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Python syntax
        run: |
          python3 -m py_compile rms_v09_egov_api_live_probe.py
          python3 -m py_compile test_rms_v09_egov_api_live_probe.py

      - name: Run offline safety tests
        run: |
          python3 -B -m unittest -v test_rms_v09_egov_api_live_probe.py

      - name: Run e-Gov API live probe
        run: |
          python3 -B rms_v09_egov_api_live_probe.py

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RMS-v09-egov-api-live-probe
          path: egov-probe-output/
          if-no-files-found: warn
          retention-days: 7

name: RMS Monitor v0.9 Case Identity Real Example Offline Safety Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-example-offline-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out test files
        uses: actions/checkout@v4

      - name: Run real example offline safety tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest -v test_rms_v09_case_identity_real_example_offline.py
